<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Burn-in Checker</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; background:#111; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }

  #screen {
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    transition: background-color .12s linear;
    cursor:pointer; user-select:none;
  }

  /* UI overlay */
  #ui {
    position:fixed; inset:0;
    display:flex; flex-direction:column;
    justify-content:space-between;
    padding:16px;
    pointer-events:none;
    opacity:1; transition:opacity .3s;
  }
  #ui.hidden { opacity:0; }

  .top-bar, .bottom-bar {
    display:flex; gap:8px; align-items:center; flex-wrap:wrap;
    pointer-events:auto;
  }
  .top-bar { justify-content:center; }
  .bottom-bar { justify-content:center; }

  button {
    background:rgba(255,255,255,.12);
    color:#fff; border:1px solid rgba(255,255,255,.25);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    padding:10px 14px; border-radius:10px;
    font-size:14px; font-weight:600;
    cursor:pointer; transition:.15s;
  }
  button:active { transform:scale(.94); background:rgba(255,255,255,.25); }
  button.active { background:#fff; color:#000; border-color:#fff; }

  #label {
    position:fixed; top:50%; left:50%;
    transform:translate(-50%,-50%);
    font-size:13px; font-weight:700; letter-spacing:1px;
    padding:8px 16px; border-radius:20px;
    pointer-events:none;
    opacity:0; transition:opacity .4s;
    text-transform:uppercase;
  }
  #label.show { opacity:1; }

  #hint {
    position:fixed; bottom:80px; left:0; right:0;
    text-align:center; color:#888; font-size:12px;
    padding:0 20px; line-height:1.5;
    pointer-events:none;
    transition:opacity .4s;
  }
  #hint.hidden { opacity:0; }

  /* Color picker row */
  #palette {
    position:fixed; bottom:0; left:0; right:0;
    display:flex; justify-content:center; gap:6px;
    padding:12px; flex-wrap:wrap;
    background:linear-gradient(to top, rgba(0,0,0,.85), transparent);
    transform:translateY(110%); transition:transform .3s;
  }
  #palette.show { transform:translateY(0); }
  .swatch {
    width:40px; height:40px; border-radius:8px;
    border:2px solid rgba(255,255,255,.3);
    cursor:pointer; transition:.15s;
  }
  .swatch:active { transform:scale(.9); }
  .swatch.active { border-color:#fff; box-shadow:0 0 0 2px rgba(255,255,255,.5); }
</style>
</head>
<body>

<div id="screen"></div>

<div id="label"></div>

<div id="ui">
  <div class="top-bar">
    <button id="fsBtn">⛶ Fullscreen</button>
    <button id="autoBtn">▶ Auto</button>
    <button id="gridBtn">▦ Grid</button>
  </div>
  <div class="bottom-bar">
    <button id="prevBtn">‹ Назад</button>
    <button id="nextBtn">Далее ›</button>
    <button id="menuBtn">🎨 Цвета</button>
  </div>
</div>

<div id="hint">Тапай по экрану — следующий цвет · Свайп влево/вправо — переключение</div>

<div id="palette"></div>

<script>
(function(){
  const screen = document.getElementById('screen');
  const label  = document.getElementById('label');
  const hint   = document.getElementById('hint');
  const ui     = document.getElementById('ui');
  const palette= document.getElementById('palette');

  // Тестовые цвета — от лучших для выявления выгорания к остальным
  const colors = [
    { name:'50% Серый',  css:'#808080', note:'ЛУЧШИЙ для проверки' },
    { name:'25% Серый',  css:'#404040', note:'Выявляет слабые следы' },
    { name:'Белый',      css:'#FFFFFF', note:'' },
    { name:'Красный',    css:'#FF0000', note:'' },
    { name:'Зелёный',    css:'#00FF00', note:'' },
    { name:'Синий',      css:'#0000FF', note:'Часто деградирует первым' },
    { name:'Голубой',    css:'#00FFFF', note:'' },
    { name:'Пурпурный',  css:'#FF00FF', note:'' },
    { name:'Жёлтый',     css:'#FFFF00', note:'' },
    { name:'Чёрный',     css:'#000000', note:'Проверка на битые пиксели' }
  ];

  let idx = 0;
  let autoTimer = null;
  let uiHidden = false;
  let gridOn = false;

  // --- Отрисовка ---
  function render(){
    const c = colors[idx];
    screen.style.background = gridOn ? '#111' : c.css;
    screen.innerHTML = '';

    if (gridOn) {
      const g = document.createElement('div');
      g.style.cssText = `position:absolute;inset:0;
        background:
          repeating-linear-gradient(0deg, ${c.css} 0 20px, transparent 20px 40px),
          repeating-linear-gradient(90deg, ${c.css} 0 20px, transparent 20px 40px);`;
      screen.appendChild(g);
    }

    // метка (авто-скрывается)
    label.textContent = c.name + (c.note ? ' · ' + c.note : '');
    label.style.color = isLight(c.css) ? '#000' : '#fff';
    label.style.background = isLight(c.css) ? 'rgba(0,0,0,.08)' : 'rgba(255,255,255,.12)';
    label.classList.add('show');
    clearTimeout(label._t);
    label._t = setTimeout(()=>label.classList.remove('show'), 1200);

    hint.classList.add('hidden');

    // активный свотч
    document.querySelectorAll('.swatch').forEach((s,i)=>{
      s.classList.toggle('active', i===idx);
    });
  }

  function isLight(hex){
    if(hex.length !== 7) return true;
    const r = parseInt(hex.substr(1,2),16);
    const g = parseInt(hex.substr(3,2),16);
    const b = parseInt(hex.substr(5,2),16);
    return (0.299*r + 0.587*g + 0.114*b) > 128;
  }

  function next(){ idx = (idx+1) % colors.length; render(); }
  function prev(){ idx = (idx-1+colors.length) % colors.length; render(); }
  function goTo(i){ idx = i; render(); }

  // --- Палитра ---
  colors.forEach((c,i)=>{
    const s = document.createElement('div');
    s.className = 'swatch';
    s.style.background = c.css;
    s.title = c.name;
    s.addEventListener('click', e=>{ e.stopPropagation(); goTo(i); });
    palette.appendChild(s);
  });

  // --- Управление ---
  screen.addEventListener('click', next);

  document.getElementById('nextBtn').addEventListener('click', e=>{ e.stopPropagation(); next(); });
  document.getElementById('prevBtn').addEventListener('click', e=>{ e.stopPropagation(); prev(); });

  document.getElementById('menuBtn').addEventListener('click', e=>{
    e.stopPropagation();
    palette.classList.toggle('show');
  });

  document.getElementById('gridBtn').addEventListener('click', e=>{
    e.stopPropagation();
    gridOn = !gridOn;
    e.target.classList.toggle('active', gridOn);
    render();
  });

  document.getElementById('fsBtn').addEventListener('click', e=>{
    e.stopPropagation();
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen?.().catch(()=>{});
    } else {
      document.exitFullscreen?.();
    }
  });

  // Авто-цикл
  document.getElementById('autoBtn').addEventListener('click', e=>{
    e.stopPropagation();
    const btn = e.target;
    if (autoTimer) {
      clearInterval(autoTimer); autoTimer = null;
      btn.classList.remove('active'); btn.textContent = '▶ Auto';
    } else {
      autoTimer = setInterval(next, 1500);
      btn.classList.add('active'); btn.textContent = '⏸ Auto';
    }
  });

  // Свайпы
  let x0 = null, y0 = null;
  screen.addEventListener('touchstart', e=>{
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
  }, {passive:true});
  screen.addEventListener('touchend', e=>{
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0;
    const dy = e.changedTouches[0].clientY - y0;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)) {
      dx < 0 ? next() : prev();
    }
    x0 = y0 = null;
  }, {passive:true});

  // Двойной тап — скрыть/показать UI
  let lastTap = 0;
  screen.addEventListener('touchend', e=>{
    const now = Date.now();
    if (now - lastTap < 300) {
      e.preventDefault();
      uiHidden = !uiHidden;
      ui.classList.toggle('hidden', uiHidden);
    }
    lastTap = now;
  });

  // Клавиатура (для десктопа)
  document.addEventListener('keydown', e=>{
    if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); next(); }
    if (e.key === 'ArrowLeft') prev();
    if (e.key === 'f') document.getElementById('fsBtn').click();
    if (e.key === 'Escape') palette.classList.remove('show');
  });

  render();
})();
</script>
</body>
</html>
