<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dubai Fountain · Digital Twin — ExtremeShooter &amp; Oarsmen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Anti-flicker boot screen (removed after app init) */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 18px;
        background: radial-gradient(ellipse at 50% 120%, #0b2540 0%, #04070d 60%);
        color: #38bdf8;
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        letter-spacing: 0.2em;
        transition: opacity 0.6s ease;
      }
      #boot .ring {
        width: 54px;
        height: 54px;
        border-radius: 50%;
        border: 3px solid rgba(56, 189, 248, 0.15);
        border-top-color: #38bdf8;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      html, body { margin: 0; padding: 0; overflow: hidden; background: #04070d; }
    </style>
  </head>
  <body>
    <div id="boot">
      <div class="ring"></div>
      <div>DUBAI FOUNTAIN · DIGITAL TWIN</div>
      <div style="font-size:11px;opacity:.6">INITIALIZING HYDRO-PHYSICS CORE…</div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
